<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">The aggregate API</title>
  <desc id="desc">An Order aggregate with commands on the left and events on the right. Commands are intents; events are facts.</desc>
  <rect width="960" height="430" fill="#fbfaf7"/>

  <text x="40" y="38" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#2b4f8c" letter-spacing="1.5">COMMANDS · INTENTS</text>
  <text x="920" y="38" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8a4a22" letter-spacing="1.5">EVENTS · FACTS</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Command cards -->
    <g>
      <rect x="40" y="76" width="280" height="38" rx="8" fill="#8FB3E8"/>
      <text x="56" y="100" font-size="13" fill="#17305c">PlaceOrder</text>
    </g>
    <g>
      <rect x="40" y="126" width="280" height="38" rx="8" fill="#8FB3E8"/>
      <text x="56" y="150" font-size="13" fill="#17305c">CapturePayment</text>
    </g>
    <g>
      <rect x="40" y="176" width="280" height="38" rx="8" fill="#8FB3E8"/>
      <text x="56" y="200" font-size="13" fill="#17305c">RecordInventoryReserved</text>
    </g>
    <g>
      <rect x="40" y="226" width="280" height="38" rx="8" fill="#8FB3E8"/>
      <text x="56" y="250" font-size="13" fill="#17305c">ConfirmOrder</text>
    </g>
    <g>
      <rect x="40" y="276" width="280" height="38" rx="8" fill="#8FB3E8"/>
      <text x="56" y="300" font-size="13" fill="#17305c">CancelOrder</text>
    </g>

    <!-- Left bracket -->
    <g stroke="#7f9fcf" stroke-width="2" fill="none">
      <path d="M320 95h20"/><path d="M320 145h20"/><path d="M320 195h20"/><path d="M320 245h20"/><path d="M320 295h20"/>
      <path d="M340 95v200"/>
      <path d="M340 210h28"/>
      <path d="M362 204l8 6-8 6" fill="#7f9fcf" stroke="none"/>
    </g>

    <!-- Aggregate -->
    <rect x="380" y="150" width="200" height="120" rx="12" fill="#F6E27A" stroke="#d8c44e" stroke-width="1.5"/>
    <text x="480" y="204" text-anchor="middle" font-size="22" font-weight="700" fill="#443c0d">Order</text>
    <text x="480" y="228" text-anchor="middle" font-size="11" fill="#6b5d16">aggregate root</text>
    <text x="480" y="248" text-anchor="middle" font-size="10" fill="#6b5d16">one invariant · one lifecycle</text>

    <!-- Right bracket -->
    <g stroke="#d09a72" stroke-width="2" fill="none">
      <path d="M580 210h28"/>
      <path d="M602 204l8 6-8 6" fill="#d09a72" stroke="none"/>
      <path d="M620 95v200"/>
      <path d="M620 95h20"/><path d="M620 145h20"/><path d="M620 195h20"/><path d="M620 245h20"/><path d="M620 295h20"/>
    </g>

    <!-- Event cards -->
    <g>
      <rect x="640" y="76" width="280" height="38" rx="8" fill="#F4A261"/>
      <text x="656" y="100" font-size="13" fill="#3a210d">OrderPlaced</text>
    </g>
    <g>
      <rect x="640" y="126" width="280" height="38" rx="8" fill="#F4A261"/>
      <text x="656" y="150" font-size="13" fill="#3a210d">PaymentCaptured</text>
    </g>
    <g>
      <rect x="640" y="176" width="280" height="38" rx="8" fill="#F4A261"/>
      <text x="656" y="200" font-size="13" fill="#3a210d">InventoryReserved</text>
    </g>
    <g>
      <rect x="640" y="226" width="280" height="38" rx="8" fill="#F4A261"/>
      <text x="656" y="250" font-size="13" fill="#3a210d">OrderConfirmed</text>
    </g>
    <g>
      <rect x="640" y="276" width="280" height="38" rx="8" fill="#F4A261"/>
      <text x="656" y="300" font-size="13" fill="#3a210d">OrderCancelled</text>
    </g>
  </g>

  <text x="480" y="362" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">The pair of lists is the aggregate's public API: what it accepts, and what it produces.</text>
  <text x="480" y="388" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">If Update shipping address exists but Create order does not, the lifecycle has a gap.</text>
</svg>
