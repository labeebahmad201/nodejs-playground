<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The Big Picture workshop flow</title>
  <desc id="desc">Ten steps from kick-off and chaotic exploration through timeline sorting, walkthrough, hot spots, arrow voting, and wrap-up.</desc>
  <rect width="960" height="330" fill="#fbfaf7"/>

  <text x="24" y="34" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1f2430">Running a Big Picture session</text>
  <text x="24" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280">Read left to right, then the next row. Times are starting points, not rules.</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Row 1 -->
    <g transform="translate(26,72)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Kick-off</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Goals, scope, and</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">the legend. Keep it short.</text>
    </g>
    <g transform="translate(212,72)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Chaos</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Events only, in parallel.</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">About 30 minutes.</text>
    </g>
    <g transform="translate(398,72)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">One timeline</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Left to right.</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">Most likely order wins.</text>
    </g>
    <g transform="translate(584,72)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Anchors</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Pivotal events and</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">swimlanes to sort.</text>
    </g>
    <g transform="translate(770,72)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">People + systems</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Who acts? What is</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">a black box?</text>
    </g>

    <!-- Row arrows -->
    <g stroke="#c6bfae" stroke-width="2" fill="none">
      <path d="M190 116h16"/><path d="M202 111l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M376 116h16"/><path d="M388 111l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M562 116h16"/><path d="M574 111l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M748 116h16"/><path d="M760 111l6 5-6 5" fill="#c6bfae" stroke="none"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(26,196)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Walkthrough</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Narrate in turns,</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">5–10 min each.</text>
    </g>
    <g transform="translate(212,196)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Reverse</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Walk end to start.</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">It exposes gaps.</text>
    </g>
    <g transform="translate(398,196)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Problems</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Red hot spots and</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">green opportunities.</text>
    </g>
    <g transform="translate(584,196)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2430">9</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Arrow vote</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Two or three votes</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">per participant.</text>
    </g>
    <g transform="translate(770,196)">
      <rect width="164" height="88" rx="12" fill="#fff" stroke="#ded8ca"/>
      <circle cx="22" cy="24" r="11" fill="#1f2430"/>
      <text x="22" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">10</text>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1f2430">Wrap up</text>
      <text x="16" y="54" font-size="11" fill="#5b6472">Top three, photos,</text>
      <text x="16" y="70" font-size="11" fill="#5b6472">next decision.</text>
    </g>

    <g stroke="#c6bfae" stroke-width="2" fill="none">
      <path d="M190 240h16"/><path d="M202 235l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M376 240h16"/><path d="M388 235l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M562 240h16"/><path d="M574 235l6 5-6 5" fill="#c6bfae" stroke="none"/>
      <path d="M748 240h16"/><path d="M760 235l6 5-6 5" fill="#c6bfae" stroke="none"/>
    </g>
  </g>
</svg>
