<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
  <title id="title">The three levels of Event Storming</title>
  <desc id="desc">Big Picture discovers the process, Process Modeling discovers the rules, Software Design discovers aggregates and boundaries. Each level adds notation and zooms in.</desc>
  <rect width="960" height="380" fill="#fbfaf7"/>

  <text x="36" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1f2430">Three zoom levels, one method</text>

  <!-- Card 1 -->
  <g transform="translate(24,64)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="280" height="262" rx="14" fill="#ffffff" stroke="#ddd6c8"/>
    <path d="M0 14a14 14 0 0 1 14-14h252a14 14 0 0 1 14 14v42H0z" fill="#F4A261"/>
    <text x="20" y="29" font-size="12" font-weight="700" fill="#5a3216" letter-spacing="1">LEVEL 1</text>
    <text x="20" y="49" font-size="18" font-weight="700" fill="#3a210d">Big Picture</text>
    <text x="20" y="92" font-size="13" fill="#3a4150">What happens, and</text>
    <text x="20" y="110" font-size="13" fill="#3a4150">where does it hurt?</text>
    <g fill="#3a4150" font-size="13">
      <circle cx="26" cy="142" r="3.5" fill="#F4A261"/><text x="40" y="146">Domain events</text>
      <circle cx="26" cy="170" r="3.5" fill="#F4A261"/><text x="40" y="174">People and systems</text>
      <circle cx="26" cy="198" r="3.5" fill="#F4A261"/><text x="40" y="202">Hot spots</text>
      <circle cx="26" cy="226" r="3.5" fill="#F4A261"/><text x="40" y="230">Opportunities</text>
    </g>
    <text x="20" y="252" font-size="11" fill="#7b8494">5–20 people · whole domain</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#b9b2a3" stroke-width="2" fill="none">
    <path d="M312 195h30"/>
    <path d="M336 189l7 6-7 6" fill="#b9b2a3" stroke="none"/>
  </g>

  <!-- Card 2 -->
  <g transform="translate(340,64)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="280" height="262" rx="14" fill="#ffffff" stroke="#ddd6c8"/>
    <path d="M0 14a14 14 0 0 1 14-14h252a14 14 0 0 1 14 14v42H0z" fill="#C3B1E1"/>
    <text x="20" y="29" font-size="12" font-weight="700" fill="#3b2a66" letter-spacing="1">LEVEL 2</text>
    <text x="20" y="49" font-size="18" font-weight="700" fill="#2c1f4d">Process Modeling</text>
    <text x="20" y="92" font-size="13" fill="#3a4150">How does this one</text>
    <text x="20" y="110" font-size="13" fill="#3a4150">process actually work?</text>
    <g fill="#3a4150" font-size="13">
      <circle cx="26" cy="142" r="3.5" fill="#C3B1E1"/><text x="40" y="146">Everything above</text>
      <circle cx="26" cy="170" r="3.5" fill="#C3B1E1"/><text x="40" y="174">Commands</text>
      <circle cx="26" cy="198" r="3.5" fill="#C3B1E1"/><text x="40" y="202">Policies</text>
      <circle cx="26" cy="226" r="3.5" fill="#C3B1E1"/><text x="40" y="230">Read models</text>
    </g>
    <text x="20" y="252" font-size="11" fill="#7b8494">4–8 people · one process</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#b9b2a3" stroke-width="2" fill="none">
    <path d="M628 195h30"/>
    <path d="M652 189l7 6-7 6" fill="#b9b2a3" stroke="none"/>
  </g>

  <!-- Card 3 -->
  <g transform="translate(656,64)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="280" height="262" rx="14" fill="#ffffff" stroke="#ddd6c8"/>
    <path d="M0 14a14 14 0 0 1 14-14h252a14 14 0 0 1 14 14v42H0z" fill="#F6E27A"/>
    <text x="20" y="29" font-size="12" font-weight="700" fill="#5f5314" letter-spacing="1">LEVEL 3</text>
    <text x="20" y="49" font-size="18" font-weight="700" fill="#443c0d">Software Design</text>
    <text x="20" y="92" font-size="13" fill="#3a4150">What do we build</text>
    <text x="20" y="110" font-size="13" fill="#3a4150">inside one context?</text>
    <g fill="#3a4150" font-size="13">
      <circle cx="26" cy="142" r="3.5" fill="#E9C94A"/><text x="40" y="146">Everything above</text>
      <circle cx="26" cy="170" r="3.5" fill="#E9C94A"/><text x="40" y="174">Aggregates</text>
      <circle cx="26" cy="198" r="3.5" fill="#E9C94A"/><text x="40" y="202">Bounded contexts</text>
      <circle cx="26" cy="226" r="3.5" fill="#E9C94A"/><text x="40" y="230">UI sketches (optional)</text>
    </g>
    <text x="20" y="252" font-size="11" fill="#7b8494">3–6 people · one context</text>
  </g>

  <text x="480" y="356" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6b7280">Zoom in; do not skip a level. A beautiful aggregate around a process nobody agreed on is still the wrong model.</text>
</svg>
