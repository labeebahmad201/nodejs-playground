<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A domain containing the problem the software solves</title>
  <desc id="desc">A large circle labeled Domain, such as the car industry, containing an irregular blob labeled the problem we solve, such as car sales.</desc>

  <circle cx="400" cy="300" r="260" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="3"/>

  <text x="400" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2937">Domain</text>
  <text x="400" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">the car industry</text>

  <path d="M 400 190
           C 462 178, 522 212, 536 268
           C 550 324, 520 382, 468 407
           C 416 432, 348 424, 308 388
           C 268 352, 254 298, 276 248
           C 298 198, 340 202, 400 190 Z"
        fill="#f9d77e" stroke="#a86b00" stroke-width="3"/>

  <text x="400" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937">The problem we solve</text>
  <text x="400" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937">car sales</text>
  <text x="400" y="338" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b4a00">the slice we model</text>
</svg>
