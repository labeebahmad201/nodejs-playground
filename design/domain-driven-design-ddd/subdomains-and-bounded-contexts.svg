<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Subdomains and bounded contexts</title>
  <desc id="desc">Subdomains live in the problem space. Bounded contexts live in the solution space and realize subdomains. The core subdomain gets the richest model; supporting and generic subdomains get simpler models or bought systems.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f2937">Subdomains and bounded contexts</text>
  <text x="600" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">Subdomains are problem space. Bounded contexts are solution space.</text>

  <!-- Problem space -->
  <text x="60" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#6b7280">PROBLEM SPACE — THE BUSINESS</text>
  <rect x="40" y="130" width="1120" height="210" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#374151">Domain (e.g. an online marketplace)</text>

  <!-- Core subdomain -->
  <rect x="80" y="190" width="300" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="230" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Core subdomain</text>
  <text x="230" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">the differentiator</text>
  <text x="230" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d">invest the best model here</text>

  <!-- Supporting subdomain -->
  <rect x="450" y="190" width="300" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Supporting subdomain</text>
  <text x="600" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">needed, but not the differentiator</text>
  <text x="600" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">simpler model or buy</text>

  <!-- Generic subdomain -->
  <rect x="820" y="190" width="300" height="120" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="3"/>
  <text x="970" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Generic subdomain</text>
  <text x="970" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">common across businesses</text>
  <text x="970" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#374151">buy or reuse</text>

  <!-- Solution space -->
  <text x="60" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#6b7280">SOLUTION SPACE</text>

  <!-- Core bounded context -->
  <rect x="80" y="440" width="300" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="230" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Core bounded context</text>
  <text x="230" y="504" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">rich model</text>
  <text x="230" y="526" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d">one ubiquitous language</text>

  <!-- Supporting bounded context -->
  <rect x="450" y="440" width="300" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Supporting bounded context</text>
  <text x="600" y="504" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">simpler model</text>
  <text x="600" y="526" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">one ubiquitous language</text>

  <!-- Generic bounded context -->
  <rect x="820" y="440" width="300" height="150" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="3"/>
  <text x="970" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Generic bounded context</text>
  <text x="970" y="504" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">off-the-shelf / integration</text>
  <text x="970" y="526" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#374151">one ubiquitous language</text>

  <!-- Mapping arrows -->
  <path d="M 230 310 L 230 440" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="242" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">realized by</text>

  <path d="M 600 310 L 600 440" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="612" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">realized by</text>

  <path d="M 970 310 L 970 440" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="982" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">realized by</text>

  <!-- Context map relationships -->
  <path d="M 380 515 L 450 515" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M 750 515 L 820 515" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="600" y="640" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">The mapping is not always 1:1. A subdomain can be realized by several bounded contexts.</text>

  <line x1="470" y1="690" x2="510" y2="690" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="520" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">context map (relationship between bounded contexts)</text>
</svg>
